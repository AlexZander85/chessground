name: Format debug

on: [push]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm run format
      - run: git diff -- tests/multiplePremove.test.ts
